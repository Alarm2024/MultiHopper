[project]
name = "multihopper-explorer"
version = "0.1.0"
description = "Read-only multi-hop route explorer for Solana swap quotes and tx size preflight"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
multihopper-explore = "multihopper_explorer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/multihopper_explorer/routes.py" = ["S112", "BLE001"]
"src/multihopper_explorer/tx_size.py" = ["BLE001"]
